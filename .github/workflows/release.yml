name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Build client binaries ──────────────────────────────────────────────────
  build-client:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: loft-cli-linux-amd64
            binary_path: dist/loft-cli

          - os: ubuntu-24.04-arm
            artifact_name: loft-cli-linux-arm64
            binary_path: dist/loft-cli

          - os: macos-latest
            artifact_name: loft-cli-macos-arm64
            binary_path: dist/loft-cli

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build binary
        run: python scripts/build_binary.py

      - name: Prepare artifact
        run: |
          mkdir -p release
          cp "${{ matrix.binary_path }}" "release/${{ matrix.artifact_name }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/${{ matrix.artifact_name }}

  # ── Build agent binaries (Linux only — agent runs on servers) ──────────────
  build-agent:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: loft-cli-agent-linux-amd64
            binary_path: dist/loft-cli-agent

          - os: ubuntu-24.04-arm
            artifact_name: loft-cli-agent-linux-arm64
            binary_path: dist/loft-cli-agent

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build agent binary
        run: python scripts/build_agent_binary.py

      - name: Prepare artifact
        run: |
          mkdir -p release
          cp "${{ matrix.binary_path }}" "release/${{ matrix.artifact_name }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/${{ matrix.artifact_name }}

  # ── Generate checksums ──────────────────────────────────────────────────────
  checksums:
    needs: [build-client, build-agent]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Flatten artifact directories
        run: |
          mkdir -p flat
          find release -type f -exec cp {} flat/ \;

      - name: Generate SHA-256 checksums
        run: |
          cd flat
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Import GPG key
        run: echo "${{ secrets.RELEASE_GPG_KEY }}" | gpg --batch --import

      - name: Sign checksums
        run: gpg --batch --yes --detach-sign --armor flat/checksums.txt

      - name: Upload checksums artifact
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: |
            flat/checksums.txt
            flat/checksums.txt.asc

  # ── Generate changelog ─────────────────────────────────────────────────────
  changelog:
    needs: [build-client, build-agent]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: kenji-miyake/setup-git-cliff@v2

      - name: Generate changelog for this release
        run: git-cliff --tag ${{ github.ref_name }} --output CHANGELOG.md

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.md

  # ── Publish GitHub Release ──────────────────────────────────────────────────
  publish:
    needs: [build-client, build-agent, checksums, changelog]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Flatten artifact directories
        run: |
          mkdir -p final
          find release -type f -exec cp {} final/ \;
          ls -lh final/

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: final/*
          body_path: final/CHANGELOG.md
