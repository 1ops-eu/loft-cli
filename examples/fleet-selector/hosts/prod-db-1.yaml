kind: bootstrap

meta:
  name: prod-db-1
  description: Production database node
  labels:
    env: production
    role: db

host:
  name: prod-db-1
  address: 203.0.113.20
  os_family: debian

login:
  user: root
  private_key: ~/.ssh/id_ed25519
  port: 22

admin_user:
  name: deploy
  groups:
    - sudo
  pubkeys:
    - ~/.ssh/id_ed25519.pub

ssh:
  port: 2222
  disable_root_login: true
  disable_password_auth: true

firewall:
  provider: ufw
  ssh_only: true
