kind: bootstrap

meta:
  name: worker-02
  description: Worker node 2 for the staging fleet
  labels:
    role: worker
    env: staging

host:
  name: worker-02
  address: 203.0.113.12
  os_family: debian

login:
  user: root
  private_key: ~/.ssh/id_ed25519
  port: 22

admin_user:
  name: deploy
  groups:
    - sudo
  pubkeys:
    - ~/.ssh/id_ed25519.pub

ssh:
  port: 2222
  disable_root_login: true
  disable_password_auth: true

firewall:
  provider: ufw
  ssh_only: true

wireguard:
  enabled: false

local:
  ssh_config:
    enabled: false
  inventory:
    enabled: false

checks: []
