kind: bootstrap

meta:
  name: server-with-open-ports
  description: >
    Bootstrap a server with UFW enabled and declarative extra port rules
    (port 80, 443, 51820/udp) via firewall.allow_ports (v0.7 feature #286).

host:
  name: web-node-1
  address: 203.0.113.20
  os_family: debian

login:
  user: root
  private_key: ~/.ssh/id_ed25519
  port: 22

admin_user:
  name: admin
  groups:
    - sudo
  pubkeys:
    - ~/.ssh/id_ed25519.pub

ssh:
  port: 2222
  disable_root_login: true
  disable_password_auth: true

firewall:
  provider: ufw
  ssh_only: false
  allow_ports:
    - port: 80
      proto: tcp
      comment: HTTP
    - port: 443
      proto: tcp
      comment: HTTPS
    - port: 51820
      proto: udp
      comment: WireGuard

local:
  ssh_config:
    enabled: true
    host_alias: web-node-1
    config_path: ~/.ssh/config
  inventory:
    enabled: true
    db_path: ~/.loft-cli/inventory.db
